<title>Спасай — приложение для еды с истекающим сроком</title>

<style>
  /* Палитра взята из самого приложения: зелёный #21A038 и прохладные
     нейтральные с лёгким уходом в зелень — чтобы документ и продукт
     читались как одна вещь. */
  :root {
    --ground: #f2f5f3;
    --surface: #ffffff;
    --surface-sunk: #e9eeeb;
    --ink: #15181a;
    --soft: #5f6b66;
    --faint: #8b968f;
    --rule: #dfe7e2;
    --accent: #21a038;
    --accent-deep: #12551f;
    --accent-wash: #e6f3ea;
    --amber: #b25c0a;
    --amber-wash: #fbeedd;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1214;
      --surface: #181c1e;
      --surface-sunk: #212729;
      --ink: #eef2f0;
      --soft: #9ba6a1;
      --faint: #6d7873;
      --rule: #272d30;
      --accent: #3ebe58;
      --accent-deep: #8fe0a2;
      --accent-wash: #14301c;
      --amber: #e8963c;
      --amber-wash: #33240f;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0f1214;
    --surface: #181c1e;
    --surface-sunk: #212729;
    --ink: #eef2f0;
    --soft: #9ba6a1;
    --faint: #6d7873;
    --rule: #272d30;
    --accent: #3ebe58;
    --accent-deep: #8fe0a2;
    --accent-wash: #14301c;
    --amber: #e8963c;
    --amber-wash: #33240f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 28px 96px;
  }

  /* Проза уже общей колонки: длинная строка читается хуже. */
  .prose { max-width: 68ch; }

  a { color: var(--accent-deep); }

  /* ── Шапка ─────────────────────────────────────────────────────── */
  header {
    background: var(--accent);
    color: #fff;
    padding: 64px 0 56px;
    margin-bottom: 64px;
  }

  header .wrap { padding-bottom: 0; }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }

  .brand svg { width: 40px; height: 40px; display: block; }

  .brand b {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  h1 {
    font-size: clamp(34px, 5.4vw, 54px);
    line-height: 1.08;
    letter-spacing: -0.025em;
    font-weight: 800;
    margin: 0 0 22px;
    text-wrap: balance;
    max-width: 17ch;
  }

  .lead {
    font-size: clamp(18px, 2.2vw, 22px);
    line-height: 1.5;
    color: #dff1e4;
    max-width: 56ch;
    margin: 0;
  }

  /* ── Полоса фактов ─────────────────────────────────────────────── */
  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1px;
    background: rgba(255, 255, 255, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.28);
    margin-top: 48px;
  }

  .facts div { background: var(--accent); padding: 18px 20px; }

  .facts dt {
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #b6ddc0;
    margin-bottom: 9px;
  }

  .facts dd { margin: 0; font-weight: 650; font-size: 16px; }

  /* ── Секции ────────────────────────────────────────────────────── */
  section { margin-top: 68px; }

  .eyebrow {
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-deep);
    display: block;
    margin-bottom: 12px;
  }

  h2 {
    font-size: clamp(24px, 3vw, 31px);
    line-height: 1.2;
    letter-spacing: -0.018em;
    font-weight: 750;
    margin: 0 0 20px;
    text-wrap: balance;
  }

  h3 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 0 0 10px;
  }

  p { margin: 0 0 16px; }
  p:last-child { margin-bottom: 0; }

  .hr {
    height: 1px;
    background: var(--rule);
    border: 0;
    margin: 0;
  }

  /* ── Карточки и сетки ──────────────────────────────────────────── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 22px 24px;
  }

  .card p { color: var(--soft); font-size: 16px; }

  /* ── Пошаговые сценарии ────────────────────────────────────────── */
  .flows {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 34px;
  }

  .flow h3 {
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 4px;
  }

  /* Порядок здесь несёт смысл: это последовательность, а не список. */
  .flow ol {
    list-style: none;
    counter-reset: step;
    margin: 0;
    padding: 0;
  }

  .flow li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 14px;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }

  .flow li::before {
    content: counter(step);
    font: 700 13px/28px var(--mono);
    text-align: center;
    color: var(--accent-deep);
    background: var(--accent-wash);
    border-radius: 50%;
    height: 28px;
  }

  /* Оба текстовых блока — во вторую колонку: иначе описание уезжает
     под номер шага, в тридцать пикселей шириной. */
  .flow li b,
  .flow li span { grid-column: 2; }

  .flow li b { display: block; font-weight: 660; margin-bottom: 3px; }
  .flow li span { color: var(--soft); font-size: 15.5px; }

  /* ── Таблицы ───────────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
  }

  th {
    text-align: left;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 15px 20px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }

  td {
    padding: 15px 20px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: 0; }
  td.what { font-weight: 620; }
  td.note { color: var(--soft); font-size: 15.5px; }

  .chip {
    display: inline-block;
    white-space: nowrap;
    font: 650 12px/1 var(--sans);
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--accent-wash);
    color: var(--accent-deep);
  }

  .chip--wait { background: var(--amber-wash); color: var(--amber); }
  .chip--none { background: var(--surface-sunk); color: var(--soft); }

  /* ── Картинки ──────────────────────────────────────────────────── */
  figure { margin: 0; }

  figure img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }

  figcaption {
    color: var(--faint);
    font-size: 14.5px;
    margin-top: 12px;
  }

  /* ── Чек ───────────────────────────────────────────────────────── */
  /* Главный предмет продукта — чек с кодом выдачи. Экономику
     показываем в его же виде, один раз за документ. */
  .receipt {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 26px 28px;
    max-width: 460px;
    font-family: var(--mono);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  .receipt div {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 11px 0;
    border-bottom: 1px dashed var(--rule);
  }

  .receipt div:last-child {
    border-bottom: 0;
    border-top: 2px solid var(--ink);
    margin-top: 6px;
    padding-top: 14px;
    font-weight: 700;
  }

  .receipt span:first-child { color: var(--soft); }

  ul.plain {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  ul.plain li {
    padding: 11px 0 11px 22px;
    border-bottom: 1px solid var(--rule);
    color: var(--soft);
    position: relative;
    font-size: 16px;
  }

  ul.plain li:last-child { border-bottom: 0; }

  ul.plain li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 21px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  ul.plain li b { color: var(--ink); font-weight: 620; }

  .fill {
    background: var(--amber-wash);
    color: var(--amber);
    border-radius: 4px;
    padding: 1px 7px;
    font: 600 14px var(--mono);
  }

  footer {
    margin-top: 76px;
    padding-top: 30px;
    border-top: 2px solid var(--ink);
    color: var(--soft);
    font-size: 15.5px;
  }

  /* Печать и выгрузка в PDF. Поля задаёт @page, поэтому у колонки
     собственных отступов уже нет — иначе они складываются. */
  @page {
    size: A4;
    margin: 14mm 13mm;
  }

  @media print {
    body {
      background: #fff;
      font-size: 10.5pt;
      line-height: 1.5;
    }

    .wrap { max-width: none; padding: 0; }

    header {
      padding: 24px 22px;
      margin: 0 0 26px;
      border-radius: 12px;
      break-inside: avoid;
    }

    header .wrap { padding: 0; }
    .brand { margin-bottom: 22px; }
    h1 { font-size: 26pt; margin-bottom: 12px; }
    .lead { font-size: 12pt; }

    /* На листе A4 автоподбор оставляет в полосе фактов пустую ячейку —
       раскладываем ровно два на два. */
    .facts {
      margin-top: 24px;
      grid-template-columns: 1fr 1fr;
    }

    section { margin-top: 22px; }
    h2 { font-size: 15pt; margin-bottom: 11px; }
    h3 { font-size: 11pt; }
    ul.plain li { padding: 8px 0 8px 22px; }
    ul.plain li::before { top: 18px; }
    .card { padding: 16px 18px; }
    .flow li { padding: 13px 0; }

    /* Ни надзаголовок, ни заголовок не остаются в одиночестве
       на дне страницы. */
    .eyebrow, h2, h3 { break-after: avoid; }
    figure, table, .receipt, .card, .flow, ul.plain li { break-inside: avoid; }

    /* Картинку нельзя разорвать между страницами, поэтому целиком она
       не влезала и уносила за собой пустую половину листа. Ограничиваем
       высоту — помещается там же, где закончился текст. */
    figure img {
      max-height: 148mm;
      width: auto;
      max-width: 100%;
      margin: 0 auto;
    }

    .prose { max-width: none; }
    footer { margin-top: 30px; break-inside: avoid; }
  }
</style>
