# Боевой стек «Спасая» на одном сервере.
# Запуск:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# Наружу торчит только nginx (80 и 443). База, Redis и API портов не публикуют —
# они доступны лишь внутри сети контейнеров.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-совместимое хранилище фотографий. Если фото уедут в Yandex Object
  # Storage — сервис можно выключить и указать боевые ключи в .env.
  minio:
    image: minio/minio:latest
    restart: always
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: production
    restart: always
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
    # Миграции применяются на старте: контейнер не поднимется на кривой схеме.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Собранная панель заведения: npm run web:build → apps/web/dist
      - ../apps/web/dist:/var/www/spasai:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - api

  # Обновление сертификата. Запускается по расписанию хоста (см. deploy/README.md).
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  postgres-data:
  redis-data:
  minio-data:
  certbot-www:
  certbot-conf:
