# Конфиг на время, пока сертификата ещё нет.
#
# Нужен, чтобы разорвать замкнутый круг: боевой конфиг требует файлы
# сертификата, без них nginx не стартует, а раз nginx не слушает 80 —
# Let's Encrypt не может проверить домен и сертификат не выдаётся.
#
# Здесь только проверка ACME. Как только сертификат появится, контейнер
# при перезапуске подхватит полный конфиг с HTTPS.

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "Спасай: сервер настраивается, выпускается сертификат.\n";
    }
}
